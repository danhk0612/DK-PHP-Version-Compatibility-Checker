name: T10 development pack exchange
on:
  pull_request:
    branches: [main, t08-licenses]
    paths:
      - 'tests/t10/**'
      - 'src/**'
      - 'tools/engine-pack/**'
      - '.github/workflows/t10-pack-exchange.yml'
permissions:
  contents: read
jobs:
  exchange:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Prepare source and development packs
        shell: pwsh
        run: |
          ./tools/engine-pack/Prepare-Pack.ps1
          python tests/t10/prepare_packs.py tools/runtime artifacts/t10-packs
          if ($LASTEXITCODE -ne 0) { throw 'Derived development pack preparation failed' }
          dotnet restore tests/t10/T10.Verification.csproj
          if ($LASTEXITCODE -ne 0) { throw 'T10 restore failed' }
          dotnet build tests/t10/T10.Verification.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'T10 build failed' }
      - name: Verify shown windows, actual scans, refusal and restoration
        shell: pwsh
        run: |
          $rule = 'DK-T10-' + [guid]::NewGuid().ToString('N')
          $program = Join-Path $pwd 'artifacts/t10/active-pack/php/php.exe'
          New-NetFirewallRule -DisplayName $rule -Direction Outbound -Program $program -Action Block | Out-Null
          try {
            dotnet run --project tests/t10/T10.Verification.csproj -c Release --no-build -- "$pwd" "$pwd/artifacts/t10-packs"
            if ($LASTEXITCODE -ne 0) { throw 'T10 exchange verification failed' }
          } finally { Remove-NetFirewallRule -DisplayName $rule }
      - name: Preserve development-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t10-pack-exchange
          path: |
            artifacts/t10/summary.json
            artifacts/t10-packs/reduced/manifest.json
            artifacts/t10-packs/full/manifest.json
          retention-days: 7
