name: T12 CSV and HTML export verification
on:
  pull_request:
    branches: [main, t11-scan-exclusions]
    paths:
      - 'src/**'
      - 'tests/t05/**'
      - 'tests/t06/**'
      - 'tests/t07/**'
      - 'tests/t12/**'
      - '.github/workflows/t12-export.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Prepare unchanged verified engine pack
        shell: pwsh
        run: ./tools/engine-pack/Prepare-Pack.ps1
      - name: Build and verify service, presentation and actual GUI
        shell: pwsh
        run: |
          $failed = @()
          foreach ($id in @('12','05','06','07')) {
            dotnet build "tests/t$id/T$id.Verification.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { $failed += "T$id build"; continue }
            $testArgs = @("$pwd")
            if ($id -ne '12') { $testArgs += "$pwd/tools/runtime" }
            dotnet run --project "tests/t$id/T$id.Verification.csproj" -c Release --no-build -- @testArgs
            if ($LASTEXITCODE -ne 0) { $failed += "T$id verification" }
          }
          if ($failed.Count) { throw ($failed -join ", ") }
      - name: Preserve owned fixture results and GUI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t12-export-evidence
          path: |
            artifacts/t05/
            artifacts/t06/
            artifacts/t07/
            artifacts/t12/
          retention-days: 7
